<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dino vs Math Aliens</title>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #120028;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>

<script>

const config = {
  type: Phaser.AUTO,
  width: 1280,
  height: 720,
  backgroundColor: '#120028',
  scene: {
    preload: preload,
    create: create,
    update: update
  }
};

new Phaser.Game(config);

let dino;
let alien;
let questionText;
let answerButtons = [];
let playerHearts;
let alienHPBar;
let xpText;
let levelText;
let infoText;

let started = false;
let currentAnswer = 0;
let playerLives = 3;
let alienHP = 100;
let xp = 0;
let level = 1;
let questionsAnswered = 0;

function preload() {

}

function create() {

  // ==============================
  // BACKGROUND
  // ==============================

  this.add.rectangle(640,360,1280,720,0x120028);

  // stars
  for(let i=0;i<150;i++) {
    this.add.circle(
      Phaser.Math.Between(0,1280),
      Phaser.Math.Between(0,720),
      Phaser.Math.Between(1,3),
      0xffffff
    ).setAlpha(Math.random());
  }

  // planets
  this.add.circle(180,120,70,0x5f27cd);
  this.add.circle(1100,150,90,0xff6b81);

  // floor
  this.add.rectangle(640,650,1280,160,0x1f1147);

  // ==============================
  // UI
  // ==============================

  xpText = this.add.text(30,20,'⭐ XP: 0',{
    fontSize:'32px',
    color:'#ffffff',
    backgroundColor:'#000000',
    padding:{x:15,y:10}
  });

  levelText = this.add.text(530,20,'LEVEL 1',{
    fontSize:'32px',
    color:'#ffffff',
    backgroundColor:'#000000',
    padding:{x:15,y:10}
  });

  playerHearts = this.add.text(1020,20,'❤️❤️❤️',{
    fontSize:'40px'
  });

  // ==============================
  // PLAYER DINO
  // ==============================

  dino = this.add.rectangle(250,470,170,170,0x2ecc71)
    .setStrokeStyle(8,0x145a32);

  this.add.text(250,470,'🦖',{
    fontSize:'90px'
  }).setOrigin(0.5);

  // bounce animation
  this.tweens.add({
    targets:dino,
    y:455,
    duration:500,
    yoyo:true,
    repeat:-1
  });

  // ==============================
  // ALIEN
  // ==============================

  alien = this.add.rectangle(1020,420,190,190,0x9b59b6)
    .setStrokeStyle(8,0x5b2c6f);

  this.add.text(1020,420,'👾',{
    fontSize:'110px'
  }).setOrigin(0.5);

  // alien HP bar background
  this.add.rectangle(1020,260,220,25,0x444444);

  // alien HP bar
  alienHPBar = this.add.rectangle(1020,260,220,25,0xff4757);

  // ==============================
  // QUESTION
  // ==============================

  questionText = this.add.text(640,170,'',{
    fontSize:'64px',
    color:'#ffff00',
    fontStyle:'bold',
    stroke:'#000000',
    strokeThickness:10
  }).setOrigin(0.5);

  // ==============================
  // INFO TEXT
  // ==============================

  infoText = this.add.text(640,270,'',{
    fontSize:'42px',
    color:'#ffffff',
    fontStyle:'bold',
    stroke:'#000000',
    strokeThickness:8
  }).setOrigin(0.5);

  // ==============================
  // ANSWER BUTTONS
  // ==============================

  createButtons.call(this);

  // ==============================
  // START SCREEN
  // ==============================

  const overlay = this.add.rectangle(640,360,1280,720,0x000000,0.75);

  const title = this.add.text(640,220,
    'DINO VS MATH ALIENS',{
      fontSize:'72px',
      color:'#ffffff',
      fontStyle:'bold',
      stroke:'#000000',
      strokeThickness:10
    }
  ).setOrigin(0.5);

  const desc = this.add.text(640,360,
    'Jawab matematika untuk menyerang alien!\n⭐ Benar = +10 XP\n❤️ Salah = kehilangan nyawa',{
      fontSize:'34px',
      align:'center',
      color:'#ffffff',
      backgroundColor:'#000000',
      padding:{x:20,y:20}
    }
  ).setOrigin(0.5);

  const startBtn = this.add.text(640,540,
    'START GAME',{
      fontSize:'50px',
      color:'#000000',
      backgroundColor:'#feca57',
      padding:{x:30,y:20},
      fontStyle:'bold'
    }
  )
  .setOrigin(0.5)
  .setInteractive();

  startBtn.on('pointerdown', ()=> {

    overlay.destroy();
    title.destroy();
    desc.destroy();
    startBtn.destroy();

    started = true;

    generateQuestion.call(this);
  });

}

// =====================================
// CREATE BUTTONS
// =====================================

function createButtons() {

  const labels = ['A','B','C','D'];

  for(let i=0;i<4;i++) {

    const x = i < 2 ? 360 : 720;
    const y = i % 2 === 0 ? 470 : 580;

    const button = this.add.text(x,y,'',{
      fontSize:'34px',
      color:'#000000',
      backgroundColor:'#ffffff',
      padding:{x:30,y:18},
      fontStyle:'bold'
    })
    .setInteractive();

    button.on('pointerover', ()=> {
      button.setScale(1.05);
    });

    button.on('pointerout', ()=> {
      button.setScale(1);
    });

    button.on('pointerdown', ()=> {
      checkAnswer.call(this, button.answer);
    });

    answerButtons.push(button);
  }
}

// =====================================
// GENERATE QUESTION
// =====================================

function generateQuestion() {

  let a;
  let b;
  let operator;

  if(level <= 2) {
    a = Phaser.Math.Between(1,5);
    b = Phaser.Math.Between(1,5);
    operator = '×';
  }
  else if(level <= 4) {
    a = Phaser.Math.Between(1,5);
    b = Phaser.Math.Between(1,5);
    operator = Phaser.Math.Between(0,1) ? '×' : '÷';
  }
  else {
    a = Phaser.Math.Between(6,10);
    b = Phaser.Math.Between(6,10);
    operator = Phaser.Math.Between(0,1) ? '×' : '÷';
  }

  let question;

  if(operator === '×') {
    currentAnswer = a*b;
    question = a + ' × ' + b;
  }
  else {
    currentAnswer = a;
    question = (a*b) + ' ÷ ' + b;
  }

  questionText.setText(question);

  createChoices();
}

// =====================================
// CREATE CHOICES
// =====================================

function createChoices() {

  let choices = [currentAnswer];

  while(choices.length < 4) {

    let wrong = currentAnswer + Phaser.Math.Between(-15,15);

    if(wrong > 0 && !choices.includes(wrong)) {
      choices.push(wrong);
    }
  }

  Phaser.Utils.Array.Shuffle(choices);

  const labels = ['A','B','C','D'];

  answerButtons.forEach((btn,index)=> {

    btn.answer = choices[index];
    btn.setText(labels[index] + '. ' + choices[index]);
  });
}

// =====================================
// CHECK ANSWER
// =====================================

function checkAnswer(answer) {

  if(!started) return;

  if(answer === currentAnswer) {

    xp += 10;
    alienHP -= 20;
    questionsAnswered++;

    xpText.setText('⭐ XP: ' + xp);

    alienHPBar.width = alienHP * 2.2;

    showInfo('CORRECT! +10 XP ⭐','#2ed573');

    // laser effect
    const laser = this.add.rectangle(500,430,400,10,0x00ffff);

    this.tweens.add({
      targets:laser,
      alpha:0,
      duration:200,
      onComplete:()=> {
        laser.destroy();
      }
    });

    // alien hit animation
    this.tweens.add({
      targets:alien,
      x:1050,
      duration:100,
      yoyo:true,
      repeat:2
    });

    if(alienHP <= 0) {

      level++;
      alienHP = 100;

      if(level > 5) {
        winGame.call(this);
        return;
      }

      levelText.setText('LEVEL ' + level);

      showInfo('ALIEN DEFEATED! 👽','#feca57');
    }

    this.time.delayedCall(700, ()=> {
      alienHPBar.width = alienHP * 2.2;
      generateQuestion.call(this);
    });

  }
  else {

    playerLives--;

    playerHearts.setText('❤️'.repeat(playerLives));

    showInfo('OOPS! 😭','#ff4757');

    // camera shake
    this.cameras.main.shake(200,0.01);

    // alien attack effect
    const blast = this.add.circle(420,430,60,0xff0000);

    this.tweens.add({
      targets:blast,
      alpha:0,
      scale:2,
      duration:300,
      onComplete:()=> {
        blast.destroy();
      }
    });

    if(playerLives <= 0) {
      gameOver.call(this);
      return;
    }

    this.time.delayedCall(600, ()=> {
      generateQuestion.call(this);
    });
  }
}

// =====================================
// INFO TEXT
// =====================================

function showInfo(text,color) {

  infoText.setText(text);
  infoText.setColor(color);

  setTimeout(()=> {
    infoText.setText('');
  },1000);
}

// =====================================
// GAME OVER
// =====================================

function gameOver() {

  started = false;

  this.add.rectangle(640,360,1280,720,0x000000,0.75);

  this.add.text(640,260,'GAME OVER',{
    fontSize:'90px',
    color:'#ff4757',
    fontStyle:'bold'
  }).setOrigin(0.5);

  this.add.text(640,380,
    'TOTAL XP: ' + xp,{
      fontSize:'42px',
      color:'#ffffff'
    }
  ).setOrigin(0.5);

  const restart = this.add.text(640,540,
    'RESTART',{
      fontSize:'52px',
      color:'#000000',
      backgroundColor:'#feca57',
      padding:{x:30,y:20},
      fontStyle:'bold'
    }
  )
  .setOrigin(0.5)
  .setInteractive();

  restart.on('pointerdown', ()=> {
    location.reload();
  });
}

// =====================================
// WIN GAME
// =====================================

function winGame() {

  started = false;

  this.add.rectangle(640,360,1280,720,0x000000,0.75);

  this.add.text(640,260,'YOU SAVED THE GALAXY! 🌌',{
    fontSize:'72px',
    color:'#feca57',
    fontStyle:'bold',
    align:'center'
  }).setOrigin(0.5);

  this.add.text(640,390,
    'FINAL XP: ' + xp,{
      fontSize:'44px',
      color:'#ffffff'
    }
  ).setOrigin(0.5);

  const replay = this.add.text(640,550,
    'PLAY AGAIN',{
      fontSize:'52px',
      color:'#000000',
      backgroundColor:'#feca57',
      padding:{x:30,y:20},
      fontStyle:'bold'
    }
  )
  .setOrigin(0.5)
  .setInteractive();

  replay.on('pointerdown', ()=> {
    location.reload();
  });
}

function update() {

}

</script>

</body>
</html>
