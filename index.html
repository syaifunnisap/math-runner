<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dino Math Runner</title>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>

<script>

const config = {
  type: Phaser.AUTO,
  width: 1280,
  height: 720,
  backgroundColor: '#87CEEB',
  scene: {
    preload,
    create,
    update
  }
};

const game = new Phaser.Game(config);

let dino;
let obstacle;
let obstacleText;
let answerButtons = [];
let xpText;
let levelText;
let heartsText;
let messageText;
let startButton;
let startTitle;
let finishText;

let gameStarted = false;
let currentAnswer = 0;
let currentLevel = 1;
let currentQuestion = 0;
let xp = 0;
let lives = 3;
let obstacleSpeed = 2;

let bg1;
let bg2;
let grass1;
let grass2;

const questionsPerLevel = 5;

function preload() {
}

function create() {

  // ============================
  // BACKGROUND
  // ============================

  bg1 = this.add.rectangle(640, 360, 1280, 720, 0x87CEEB);

  // awan
  for(let i=0; i<8; i++) {
    this.add.ellipse(
      Phaser.Math.Between(0,1280),
      Phaser.Math.Between(50,250),
      180,
      70,
      0xffffff
    ).setAlpha(0.8);
  }

  // pohon kiri kanan
  for(let i=0; i<10; i++) {

    // kiri
    this.add.rectangle(80, 150 + i*80, 25, 80, 0x8B5A2B);
    this.add.circle(80, 110 + i*80, 50, 0x2ecc71);

    // kanan
    this.add.rectangle(1200, 150 + i*80, 25, 80, 0x8B5A2B);
    this.add.circle(1200, 110 + i*80, 50, 0x2ecc71);
  }

  // rumput
  grass1 = this.add.rectangle(640, 650, 1280, 140, 0x4CAF50);
  grass2 = this.add.rectangle(640, 700, 1280, 60, 0x2E7D32);

  // jalan
  this.add.rectangle(640, 550, 1280, 220, 0x666666);

  // garis jalan
  for(let i=0; i<20; i++) {
    this.add.rectangle(100 + i*70, 550, 40, 8, 0xffffff);
  }

  // ============================
  // UI
  // ============================

  xpText = this.add.text(40, 20, '⭐ XP: 0', {
    fontSize: '34px',
    color: '#ffffff',
    fontStyle: 'bold',
    backgroundColor: '#00000088',
    padding: {x:15,y:10}
  });

  levelText = this.add.text(450, 20, 'LEVEL 1', {
    fontSize: '34px',
    color: '#ffffff',
    fontStyle: 'bold',
    backgroundColor: '#00000088',
    padding: {x:15,y:10}
  });

  heartsText = this.add.text(1000, 20, '❤️❤️❤️', {
    fontSize: '40px'
  });

  // ============================
  // DINO CHARACTER
  // ============================

  dino = this.add.text(250, 520, '🦖🚲', {
    fontSize: '90px'
  });

  // goyang-goyang animation
  this.tweens.add({
    targets: dino,
    y: 510,
    duration: 400,
    yoyo: true,
    repeat: -1
  });

  // ============================
  // OBSTACLE
  // ============================

  obstacle = this.add.rectangle(640, 250, 100, 80, 0x777777)
    .setStrokeStyle(6,0x555555);

  obstacleText = this.add.text(640, 250, '', {
    fontSize: '42px',
    color: '#ffffff',
    fontStyle: 'bold'
  }).setOrigin(0.5);

  obstacle.visible = false;
  obstacleText.visible = false;

  // ============================
  // MESSAGE
  // ============================

  messageText = this.add.text(640, 180, '', {
    fontSize: '50px',
    color: '#ffff00',
    fontStyle: 'bold',
    stroke: '#000000',
    strokeThickness: 8
  }).setOrigin(0.5);

  // ============================
  // ANSWER BUTTONS
  // ============================

  createAnswerButtons.call(this);

  // ============================
  // START SCREEN
  // ============================

  this.add.rectangle(640,360,1280,720,0x000000,0.6)
    .setDepth(100)
    .setName('overlay');

  startTitle = this.add.text(640,220,
    'DINO MATH RUNNER',
    {
      fontSize:'72px',
      color:'#ffffff',
      fontStyle:'bold',
      stroke:'#000000',
      strokeThickness:10
    }
  ).setOrigin(0.5).setDepth(101);

  this.add.text(640,330,
    'Jawab soal matematika untuk menghancurkan batu!\n\n⭐ Jawaban benar = +10 XP\n❤️ Salah = kehilangan nyawa',
    {
      align:'center',
      fontSize:'34px',
      color:'#ffffff',
      backgroundColor:'#00000088',
      padding:{x:20,y:20}
    }
  ).setOrigin(0.5).setDepth(101);

  startButton = this.add.text(640,520,
    'START GAME',
    {
      fontSize:'48px',
      color:'#000000',
      backgroundColor:'#FFD93D',
      padding:{x:30,y:20},
      fontStyle:'bold'
    }
  )
  .setOrigin(0.5)
  .setInteractive()
  .setDepth(101);

  startButton.on('pointerdown', ()=> {
    startGame.call(this);
  });

  // ============================
  // KEYBOARD SUPPORT
  // ============================

  this.input.keyboard.on('keydown-A', ()=> {
    if(answerButtons[0]) checkAnswer.call(this, answerButtons[0].answer);
  });

  this.input.keyboard.on('keydown-B', ()=> {
    if(answerButtons[1]) checkAnswer.call(this, answerButtons[1].answer);
  });

  this.input.keyboard.on('keydown-C', ()=> {
    if(answerButtons[2]) checkAnswer.call(this, answerButtons[2].answer);
  });

  this.input.keyboard.on('keydown-D', ()=> {
    if(answerButtons[3]) checkAnswer.call(this, answerButtons[3].answer);
  });

}

// =====================================
// CREATE ANSWER BUTTONS
// =====================================

function createAnswerButtons() {

  const labels = ['A','B','C','D'];

  for(let i=0; i<4; i++) {

    let x = 300 + (i%2)*400;
    let y = 80 + Math.floor(i/2)*90;

    const btn = this.add.text(x,y,'',{
      fontSize:'32px',
      color:'#000000',
      backgroundColor:'#ffffff',
      padding:{x:25,y:15},
      fontStyle:'bold'
    })
    .setInteractive();

    btn.on('pointerdown', ()=> {
      checkAnswer.call(this, btn.answer);
    });

    answerButtons.push(btn);
  }
}

// =====================================
// START GAME
// =====================================

function startGame() {

  gameStarted = true;

  this.children.getByName('overlay').destroy();
  startTitle.destroy();
  startButton.destroy();

  generateQuestion.call(this);
}

// =====================================
// GENERATE QUESTION
// =====================================

function generateQuestion() {

  let num1;
  let num2;
  let operator;

  if(currentLevel <= 2) {
    operator = '×';
    num1 = Phaser.Math.Between(1,5);
    num2 = Phaser.Math.Between(1,5);
  }
  else if(currentLevel <=4) {
    operator = Phaser.Math.Between(0,1) ? '×' : '÷';
    num1 = Phaser.Math.Between(1,5);
    num2 = Phaser.Math.Between(1,5);
  }
  else {
    operator = Phaser.Math.Between(0,1) ? '×' : '÷';
    num1 = Phaser.Math.Between(6,10);
    num2 = Phaser.Math.Between(6,10);
  }

  let question;

  if(operator === '×') {
    currentAnswer = num1 * num2;
    question = `${num1} × ${num2}`;
  }
  else {
    currentAnswer = num1;
    question = `${num1*num2} ÷ ${num2}`;
  }

  obstacleText.setText(question);

  createChoices(question);

  // ukuran obstacle berdasarkan kesulitan
  let difficulty = Math.max(num1,num2);

  obstacle.width = 80 + difficulty*18;
  obstacle.height = 60 + difficulty*15;

  obstacle.scale = 0.2;
  obstacle.x = 640;
  obstacle.y = 200;

  obstacleText.scale = 0.2;
  obstacleText.x = 640;
  obstacleText.y = 200;

  obstacle.visible = true;
  obstacleText.visible = true;

}

// =====================================
// CREATE CHOICES
// =====================================

function createChoices() {

  let choices = [currentAnswer];

  while(choices.length < 4) {

    let wrong = currentAnswer + Phaser.Math.Between(-15,15);

    if(wrong > 0 && !choices.includes(wrong)) {
      choices.push(wrong);
    }
  }

  Phaser.Utils.Array.Shuffle(choices);

  const labels = ['A','B','C','D'];

  answerButtons.forEach((btn,index)=> {

    btn.answer = choices[index];

    btn.setText(`${labels[index]}. ${choices[index]}`);
  });
}

// =====================================
// CHECK ANSWER
// =====================================

function checkAnswer(answer) {

  if(!gameStarted) return;

  if(answer === currentAnswer) {

    xp += 10;
    currentQuestion++;

    xpText.setText(`⭐ XP: ${xp}`);

    showMessage.call(this,'CORRECT! +10 XP ⭐','#00ff00');

    // obstacle pecah
    this.tweens.add({
      targets:[obstacle, obstacleText],
      alpha:0,
      duration:300,
      onComplete: ()=> {

        obstacle.alpha = 1;
        obstacleText.alpha = 1;

        if(currentQuestion >= questionsPerLevel) {
          nextLevel.call(this);
        }
        else {
          generateQuestion.call(this);
        }
      }
    });

    // dino bounce
    this.tweens.add({
      targets:dino,
      y:480,
      duration:120,
      yoyo:true
    });

  }
  else {

    lives--;

    heartsText.setText('❤️'.repeat(lives));

    showMessage.call(this,'OOPS! 😭','#ff0000');

    // shake camera
    this.cameras.main.shake(300,0.01);

    // dino mundur
    this.tweens.add({
      targets:dino,
      x:220,
      duration:120,
      yoyo:true
    });

    if(lives <= 0) {
      gameOver.call(this);
      return;
    }

    generateQuestion.call(this);
  }
}

// =====================================
// NEXT LEVEL
// =====================================

function nextLevel() {

  currentLevel++;
  currentQuestion = 0;

  if(currentLevel > 5) {
    winGame.call(this);
    return;
  }

  obstacleSpeed += 0.8;

  levelText.setText(`LEVEL ${currentLevel}`);

  showMessage.call(this,`LEVEL ${currentLevel}! 🔥`,'#ffff00');

  generateQuestion.call(this);
}

// =====================================
// GAME OVER
// =====================================

function gameOver() {

  gameStarted = false;

  this.add.rectangle(640,360,1280,720,0x000000,0.7);

  this.add.text(640,260,
    'GAME OVER',
    {
      fontSize:'80px',
      color:'#ff0000',
      fontStyle:'bold'
    }
  ).setOrigin(0.5);

  this.add.text(640,360,
    `XP AKHIR: ${xp}`,
    {
      fontSize:'42px',
      color:'#ffffff'
    }
  ).setOrigin(0.5);

  const restart = this.add.text(640,500,
    'RESTART',
    {
      fontSize:'50px',
      backgroundColor:'#FFD93D',
      color:'#000000',
      padding:{x:30,y:20},
      fontStyle:'bold'
    }
  )
  .setOrigin(0.5)
  .setInteractive();

  restart.on('pointerdown', ()=> {
    location.reload();
  });
}

// =====================================
// WIN GAME
// =====================================

function winGame() {

  gameStarted = false;

  this.add.rectangle(640,360,1280,720,0x000000,0.7);

  finishText = this.add.text(640,260,
    'YOU WIN! 🎉',
    {
      fontSize:'90px',
      color:'#ffff00',
      fontStyle:'bold',
      stroke:'#000000',
      strokeThickness:10
    }
  ).setOrigin(0.5);

  this.add.text(640,380,
    `TOTAL XP: ${xp}`,
    {
      fontSize:'48px',
      color:'#ffffff'
    }
  ).setOrigin(0.5);

  const replay = this.add.text(640,520,
    'PLAY AGAIN',
    {
      fontSize:'48px',
      backgroundColor:'#FFD93D',
      color:'#000000',
      padding:{x:30,y:20},
      fontStyle:'bold'
    }
  )
  .setOrigin(0.5)
  .setInteractive();

  replay.on('pointerdown', ()=> {
    location.reload();
  });
}

// =====================================
// MESSAGE
// =====================================

function showMessage(text,color) {

  messageText.setText(text);
  messageText.setColor(color);

  this.time.delayedCall(1000, ()=> {
    messageText.setText('');
  });
}

// =====================================
// UPDATE LOOP
// =====================================

function update() {

  if(!gameStarted) return;

  // obstacle mendekat ala subway surfers
  obstacle.scale += 0.006 * obstacleSpeed;
  obstacleText.scale += 0.006 * obstacleSpeed;

  obstacle.y += 2.5 * obstacleSpeed;
  obstacleText.y += 2.5 * obstacleSpeed;

  // jika obstacle sampai player
  if(obstacle.scale >= 2.5) {

    lives--;

    heartsText.setText('❤️'.repeat(lives));

    this.cameras.main.shake(300,0.01);

    showMessage.call(this,'TOO SLOW! 💥','#ff0000');

    if(lives <= 0) {
      gameOver.call(this);
      return;
    }

    generateQuestion.call(this);
  }

}

</script>

</body>
</html>
